<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio · Morada do Guaruçá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F2E7;
    --paper: #FFFFFF;
    --ink: #2B2E1F;
    --ink-soft: #5B5E48;
    --olive: #55632F;
    --olive-deep: #3E4A22;
    --olive-soft: #93A06A;
    --sand: #B98A2E;
    --line: #E1DBC6;
    --radius: 14px;
    --maxw: 780px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .bg-texture{
    position:fixed; inset:0; z-index:-1; opacity:.5; pointer-events:none;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(85,99,47,.07), transparent 40%),
      radial-gradient(circle at 90% 92%, rgba(85,99,47,.07), transparent 40%);
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(246,242,231,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .header-top{
    max-width:var(--maxw); margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 8px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img.logo{ height:38px; width:auto; flex-shrink:0; display:block; }
  .brand-text{ line-height:1.1; }
  .brand-text span{
    font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .lang-toggle{
    display:flex; border:1px solid var(--olive-soft); border-radius:999px; overflow:hidden;
    flex-shrink:0;
  }
  .lang-toggle button{
    border:none; background:transparent; padding:7px 14px; font-family:'Inter',sans-serif;
    font-size:.78rem; font-weight:600; letter-spacing:.03em; color:var(--olive-deep);
    cursor:pointer; transition:background .2s,color .2s;
  }
  .lang-toggle button.active{ background:var(--olive); color:#fff; }

  nav.cats{
    max-width:var(--maxw); margin:0 auto;
    display:flex; gap:8px; overflow-x:auto; padding:6px 18px 12px;
    scrollbar-width:none;
  }
  nav.cats::-webkit-scrollbar{ display:none; }
  nav.cats a{
    flex-shrink:0; white-space:nowrap;
    font-size:.76rem; font-weight:600; letter-spacing:.02em;
    color:var(--ink-soft); text-decoration:none;
    padding:6px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper);
    transition:background .2s,color .2s,border-color .2s;
  }
  nav.cats a.active{
    background:var(--olive); color:#fff; border-color:var(--olive);
  }

  /* ---------- Main ---------- */
  main{ max-width:var(--maxw); margin:0 auto; padding:20px 18px 60px; }

  .wave{ width:100%; height:14px; display:block; margin:6px 0 22px; }
  .wave path{ stroke:var(--olive-soft); stroke-width:2; fill:none; }

  section.cat{ scroll-margin-top:118px; margin-bottom:42px; }
  section.cat h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:1.55rem;
    color:var(--olive-deep); margin:0 0 2px;
  }

  .item{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
  }
  .item-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  }
  .item-name{
    font-family:'Fraunces',serif; font-weight:600; font-size:1.02rem;
    color:var(--ink);
  }
  .item-price{
    font-weight:700; font-size:.98rem; color:var(--sand);
    white-space:nowrap;
  }
  .item-desc{
    margin-top:5px; font-size:.86rem; line-height:1.4; color:var(--ink-soft);
    font-style:italic;
  }

  footer{
    max-width:var(--maxw); margin:0 auto; padding:10px 18px 50px;
    text-align:center; color:var(--ink-soft); font-size:.8rem; line-height:1.6;
  }
  footer .taxa{ font-weight:600; color:var(--olive-deep); margin-bottom:6px; }
  .footer-links{
    display:flex; justify-content:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;
  }
  .footer-links a{
    display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; color:var(--olive-deep);
    border:1px solid var(--olive-soft); border-radius:999px;
    padding:8px 16px; font-size:.78rem; font-weight:600;
    transition:background .2s,color .2s;
  }
  .footer-links a:hover{ background:var(--olive); color:#fff; border-color:var(--olive); }
  .footer-links svg{ width:15px; height:15px; }

  .top-link{
    position:fixed; right:16px; bottom:16px; z-index:40;
    width:42px; height:42px; border-radius:50%;
    background:var(--olive); color:#fff;
    display:flex; align-items:center; justify-content:center;
    text-decoration:none; box-shadow:0 3px 10px rgba(0,0,0,.18);
    font-size:1.1rem;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .top-link.show{ opacity:1; pointer-events:auto; }

  @media (min-width:600px){
    .item-name{ font-size:1.08rem; }
  }
</style>
</head>

/* ============ Render ============ */
let currentLang = 'pt';

function renderNav(){
  const nav = document.getElementById('catNav');
  nav.innerHTML = MENU.map(c =>
    `<a href="#${c.id}" data-target="${c.id}">${c.title[currentLang]}</a>`
  ).join('');
}

function renderMenu(){
  const root = document.getElementById('menuRoot');
  root.innerHTML = MENU.map(c => `
    <section class="cat" id="${c.id}">
      <h2>${c.title[currentLang]}</h2>
      <svg class="wave" viewBox="0 0 300 14" preserveAspectRatio="none">
        <path d="M0 7 Q 15 0, 30 7 T 60 7 T 90 7 T 120 7 T 150 7 T 180 7 T 210 7 T 240 7 T 270 7 T 300 7" />
      </svg>
      ${c.items.map(it => `
        <div class="item">
          <div class="item-row">
            <div class="item-name">${it[currentLang].name}</div>
            <div class="item-price">${it.price}</div>
          </div>
          ${it[currentLang].desc ? `<div class="item-desc">${it[currentLang].desc}</div>` : ''}
        </div>
      `).join('')}
    </section>
  `).join('');
}

function renderStaticText(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if (UI[key]) el.textContent = UI[key][currentLang];
  });
}

function renderAll(){
  renderNav();
  renderMenu();
  renderStaticText();
  setupScrollSpy();
}

/* ============ Idioma ============ */
document.getElementById('langToggle').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  currentLang = btn.getAttribute('data-lang');
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  document.documentElement.lang = currentLang === 'pt' ? 'pt-BR' : 'es';
  renderAll();
});

/* ============ Nav ativa via scroll ============ */
let observer;
function setupScrollSpy(){
  if (observer) observer.disconnect();
  const links = Array.from(document.querySelectorAll('#catNav a'));
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const link = links.find(l => l.dataset.target === entry.target.id);
      if(!link) return;
      if(entry.isIntersecting){
        links.forEach(l=>l.classList.remove('active'));
        link.classList.add('active');
        link.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
      }
    });
  }, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
  document.querySelectorAll('section.cat').forEach(s=>observer.observe(s));
}
